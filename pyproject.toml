[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magnatum-multi-agent-opportunity-workflow"
version = "0.1.0"
description = "Sanitized portfolio implementation of an AI-assisted opportunity workflow"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Esteban Barrera Navarro" }]
dependencies = []

[project.scripts]
magnatum-workflow-demo = "magnatum_workflow.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

